<div class="shell-shell">
  <section class="shell-main">
    <div class="shell-toolbar">
      <a class="shell-brand" routerLink="/publisher" translate>APP_NAME</a>
      <nav class="shell-nav" aria-label="Primary navigation">
        <a class="nav-link" routerLink="/publisher" routerLinkActive="active" translate>Comics</a>
        <a class="nav-link" routerLink="/search" routerLinkActive="active" translate>Search</a>
        <a class="nav-link" routerLink="/tools" routerLinkActive="active" translate>Tools</a>
        <a class="nav-link" routerLink="/about" routerLinkActive="active" translate>About</a>
      </nav>
      <div class="shell-spacer"></div>
      <div style="color: white">
        <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
          <mat-icon>person</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <span mat-menu-item disabled>{{ username }}</span>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span translate>Logout</span>
          </button>
        </mat-menu>
      </div>
      <app-language-selector [icon]="true" style="color: white"></app-language-selector>
    </div>
    <div class="shell-content">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
