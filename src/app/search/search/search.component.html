<div class="page search-page">
  <form class="search-form" [formGroup]="form" (ngSubmit)="searchComics()">
    <div class="search-field search-title">
      <label for="search-title">{{ 'Comic title' | translate }}</label>
      <input id="search-title" type="search" formControlName="title" [placeholder]="'Title or filename' | translate" />
    </div>

    <div class="search-field">
      <label for="search-hero">{{ 'Hero' | translate }}</label>
      <select id="search-hero" formControlName="hero">
        <option value="All">{{ 'All heroes' | translate }}</option>
        @for (hero of options().heroes; track hero) {
        <option [value]="hero">{{ hero }}</option>
        }
      </select>
    </div>

    <div class="search-field">
      <label for="search-publisher">{{ 'Publisher' | translate }}</label>
      <select id="search-publisher" formControlName="publisher">
        <option value="All">{{ 'All publishers' | translate }}</option>
        @for (publisher of options().publishers; track publisher) {
        <option [value]="publisher">{{ publisher }}</option>
        }
      </select>
    </div>

    <div class="search-field">
      <label for="search-collection">{{ 'Collection' | translate }}</label>
      <select id="search-collection" formControlName="collection">
        <option value="All">{{ 'All collections' | translate }}</option>
        @for (collection of options().collections; track collection) {
        <option [value]="collection">{{ collection }}</option>
        }
      </select>
    </div>

    <div class="search-field">
      <label for="search-availability">{{ 'Availability' | translate }}</label>
      <select id="search-availability" formControlName="availability">
        <option value="All">{{ 'All comics' | translate }}</option>
        <option value="Available">{{ 'Available' | translate }}</option>
        <option value="Missing">{{ 'Missing' | translate }}</option>
      </select>
    </div>

    <button type="submit">{{ 'Search' | translate }}</button>
  </form>

  @if (isLoading()) {
  <div class="search-state">{{ 'Loading comics' | translate }}</div>
  } @else {
  <div class="results-heading">
    <h1>{{ 'Search results' | translate }}</h1>
    <span>{{ results().comics.length }} {{ 'comics' | translate }}</span>
  </div>
  @if (results().comics.length === 0) {
  <div class="search-state">{{ 'No comics found' | translate }}</div>
  } @else {
  <app-comic [comicsInput]="results().comics" [displayPublisher]="true"></app-comic>
  } }
</div>
