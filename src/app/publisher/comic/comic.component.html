<div class="page no-padding">
  <div class="comic-grid">
    <div class="comic-item" *ngFor="let item of displayedComics; trackBy: trackByComic">
      <div style="width: 150px; height: 230px; background-color: black; position: relative">
        <img
          [id]="item['id']"
          [ngClass]="item.class"
          [src]="item.thumbnailPath"
          (click)="openDialog(item)"
          loading="lazy"
          [attr.title]="item['decodedPath']"
        />
        <div
          class="comic-publisher"
          *ngIf="this.displayPublisher"
          style="position: absolute; left: 0; bottom: 0px; right: 0"
        >
          {{ item.publisher }}
        </div>

        <div class="comic-collection" *ngIf="item.collection" style="position: absolute; left: 0; top: 0px; right: 0">
          {{ item.collection }}
        </div>

        <div class="hero-container">
          <div
            [attr.title]="hero.name"
            class="hero-circle"
            [style.background-image]="hero.imagePath"
            *ngFor="let hero of item['heroDisplay']; trackBy: trackByHero"
          >
            {{ hero.exists ? '' : '?' }}
          </div>
        </div>

        <div class="download-circle" *ngIf="!item.missing">
          <a href="{{ environment.serverUrl + item.path }}" style="color: white">
            <mat-icon class="icon"> download </mat-icon>
          </a>
        </div>
      </div>

      <div class="comicinfo" style="position: relative">
        <!-- <div class="heroimage" [ngClass]="calculateClass(item)"></div> -->

        <div class="comic-number-row" style="margin-bottom: 3px">
          <div class="number-circle2" *ngIf="item.number">
            <span class="number">
              {{ item.number }}
            </span>
          </div>
          <div class="number-circle" *ngIf="item.seqNumber !== undefined">
            <span class="number">
              {{ item.seqNumber }}
            </span>
          </div>
        </div>

        <ng-container *ngIf="(item.titles?.length ?? 0) > 1">
          <div class="title" *ngFor="let title of item.titles; trackBy: trackByTitle">&#x25cf; {{ title }}</div>
        </ng-container>

        <ng-container *ngIf="item.titles?.length === 1">
          <div class="title">{{ item.titles[0] }}</div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
