<div class="page">
  <div
    style="
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: flex-start;
      align-content: flex-start;
      align-items: flex-start;
    "
  >
    @for (item of publishers(); track trackByPublisher($index, item)) {
    <div class="rootlink" (click)="openFolder(item.path, item.name)" [ngClass]="item.cssClass">
      {{ item.name }}
    </div>
    }
  </div>
</div>
